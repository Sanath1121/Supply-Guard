[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#030712"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
font = "sans serif"
