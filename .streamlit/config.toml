[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
headless = true
port = 8501
# Local demo only - re-enable CORS and XSRF for production deployment
enableCORS = false
enableXsrfProtection = false

[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#111A2E"
textColor = "#F1F5F9"
font = "sans serif"
