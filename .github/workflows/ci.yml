name: SupplyGuard CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Quality Checks and Test Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install PyTorch (CPU) and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Syntax and Bytecode compilation check
        run: |
          python -m py_compile $(find src training tests -name "*.py")

      - name: Execute Phase 0 Gate Verification
        run: |
          python tests/run_phase_tests.py --phase 0

      - name: Execute Model and Architecture Smoke Test
        run: |
          python -m tests.smoke_test
